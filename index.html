<style>
:root{
  --bg:#fbf3e5; --bg2:#f6e6cc; --card:#fffaf1; --card2:#fff4e2;
  --line:#ecd5b3; --line2:#e3c59b;
  --ink:#4a2f22; --ink2:#7d5f4c; --ink3:#a98c74;
  --or:#ef8a2d; --or-d:#c96a14; --or-l:#ffe2bd; --or-ll:#fff0da;
  --red:#b9493c; --red-d:#8f3329; --red-l:#f8dad3;
  --ok:#6f9a50; --ok-d:#527a37; --ok-l:#e5efd6;
  --foot:50px;
  --r:20px;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 26px -14px rgba(166,96,30,.38);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-padding-bottom:140px}
body{
  font-family:'Nunito','Manrope',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; min-height:100dvh;
  font-size:16px; line-height:1.45; font-weight:600;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(520px 360px at 108% -6%, rgba(239,138,45,.20), transparent 70%),
    radial-gradient(460px 380px at -12% 104%, rgba(222,150,80,.16), transparent 70%),
    linear-gradient(180deg,#fcf5e8,#f8ebd4);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}

#app{max-width:560px;margin:0 auto;padding:12px 14px calc(var(--foot) + 24px);min-height:100vh;min-height:100dvh}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breakh{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 20px;border-radius:17px;font-weight:800;font-size:17px;letter-spacing:.2px;
  color:#fff;background:linear-gradient(180deg,#f59a42,#ee8527);
  border-bottom:4px solid var(--or-d);
  box-shadow:0 10px 18px -10px rgba(201,106,20,.6);
  transition:transform .12s, box-shadow .12s, filter .15s;
  text-decoration:none;text-align:center;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.btn[disabled]{background:#ecdcc3;color:#b8997a;border-bottom-color:#dcc6a4;box-shadow:none;pointer-events:none}
.btn.ghost{color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-bottom:4px solid var(--line2);box-shadow:none}
.btn.ghost:active{border-bottom-width:1.5px}
.btn.small{padding:10px 14px;font-size:15px;border-radius:14px;width:auto}
.btn.red{background:linear-gradient(180deg,#c85a4c,#b2432f);border-bottom-color:var(--red-d)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{height:12px}.sp2{height:22px}

/* ---------- карточки ---------- */
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px;
}
.card.tint{background:linear-gradient(180deg,var(--card2),var(--card))}

/* ---------- шапка игры ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.iconbtn{
  width:42px;height:42px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none;box-shadow:var(--shadow);transition:transform .12s;color:var(--ink2)
}
.iconbtn:active{transform:scale(.94)}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .mid b{display:block;font-size:16px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .mid small{display:block;color:var(--ink3);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:4px;flex:none}
.heart{width:25px;height:25px;display:block}
.heart.lost path{fill:#ead7bd}
.heart.break{animation:breakh .6s ease}
.bar{height:8px;border-radius:99px;background:#efdcc0;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f6a04b,#ee8527);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 12px}
.dots i{width:9px;height:9px;border-radius:99px;background:#ecd8bb;transition:.3s}
.dots i.now{background:var(--or);width:22px}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:#cf7e72}

/* ---------- главная ---------- */
.home{text-align:center;padding-top:4px}
.home .logo{width:112px;height:auto;display:block;margin:4px auto 4px;animation:floaty 5s ease-in-out infinite}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.title{font-size:34px;line-height:1.02;font-weight:900;letter-spacing:.01em;margin:6px 0 4px;color:var(--ink)}
.title span{color:var(--or)}
.lead{color:var(--ink2);font-size:15.5px;margin:0 auto 16px;max-width:380px}
.modes{display:flex;flex-direction:column;gap:11px;text-align:left}
.mode{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:21px;
  background:var(--card);border:1.5px solid var(--line);border-bottom:4px solid var(--line2);
  transition:transform .14s, box-shadow .14s;width:100%;text-align:left
}
.mode:hover{transform:translateY(-2px);box-shadow:0 14px 24px -16px rgba(166,96,30,.5)}
.mode:active{transform:translateY(1px);border-bottom-width:2px}
.mode .ic{
  width:58px;height:58px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(160deg,#ffe9cb,#ffd3a1);box-shadow:0 1px 0 #fff inset
}
.mode .tx{flex:1;min-width:0}
.mode .tx b{display:block;font-size:18px;font-weight:900;line-height:1.1}
.mode .tx span{display:block;font-size:13.5px;color:var(--ink2);margin-top:3px;font-weight:600;line-height:1.3}
.mode .best{margin-top:6px;display:inline-block;font-size:12px;font-weight:800;color:var(--or-d);background:var(--or-ll);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.mode .go{color:var(--ink3);flex:none}
.link{display:inline-flex;align-items:center;gap:7px;color:var(--or-d);font-weight:800;font-size:15.5px;padding:10px 6px}
.link svg{flex:none}

/* ---------- вступление к режиму ---------- */
.intro{text-align:center}
.intro .big{width:84px;height:84px;margin:6px auto 10px;border-radius:26px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,#ffe9cb,#ffd3a1);box-shadow:0 1px 0 #fff inset,0 14px 24px -14px rgba(201,106,20,.6)}
.intro h2{font-size:27px;font-weight:900}
.rules{margin:14px 0 6px;display:flex;flex-direction:column;gap:9px;text-align:left}
.rule{display:flex;gap:11px;align-items:flex-start;font-size:15.5px}
.rule i{flex:none;width:28px;height:28px;border-radius:10px;background:var(--or-l);display:grid;place-items:center;font-style:normal;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:800;color:var(--or-d);background:var(--or-ll);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* ---------- вопрос ---------- */
.qcard{padding:18px 18px 16px}
.qtag{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qtag .chip.n{background:var(--or);color:#fff;border-color:transparent}
.q{font-size:20px;line-height:1.32;font-weight:800;letter-spacing:.005em}
.q.s{font-size:17px}
.q small{display:block;font-size:14px;color:var(--ink2);font-weight:700;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  padding:13px 14px;border-radius:16px;background:#fffdf8;border:1.5px solid var(--line);border-bottom:3.5px solid var(--line2);
  font-weight:700;font-size:16.5px;line-height:1.3;transition:transform .12s,background .2s,border-color .2s;
}
.opt:hover{border-color:#e0b985}
.opt:active{transform:translateY(1px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--or-ll);color:var(--or-d);display:grid;place-items:center;font-weight:900;font-size:14px;border:1px solid var(--line)}
.opt .t{flex:1;min-width:0}
.opt .own{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:3px}
.opt.year{justify-content:center;font-size:24px;font-weight:900;letter-spacing:.02em;padding:15px}
.opt.year .k{display:none}
.opts.yrs{display:grid;grid-template-columns:1fr 1fr}
.opt.correct{background:var(--ok-l);border-color:var(--ok);border-bottom-color:var(--ok-d);animation:pop .4s}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--red-l);border-color:#d68a7f;border-bottom-color:var(--red);animation:shake .45s}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.55}
.opts.locked .opt{pointer-events:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tf .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:16px 8px;font-size:17px;font-weight:900;letter-spacing:.04em}
.tf .opt svg{width:30px;height:30px}
.typein{display:flex;gap:10px;margin-top:14px}
.typein input{
  flex:1;min-width:0;font:inherit;font-size:26px;font-weight:900;letter-spacing:.06em;text-align:center;
  padding:12px 14px;border-radius:16px;border:1.5px solid var(--line2);background:#fffdf8;color:var(--ink);outline:none;
  box-shadow:0 2px 0 rgba(255,255,255,.9) inset;
}
.typein input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(239,138,45,.18)}
.typein input.correct{border-color:var(--ok);background:var(--ok-l)}
.typein input.wrong{border-color:var(--red);background:var(--red-l);animation:shake .45s}
.typein .btn{width:auto;flex:none;padding:12px 18px}
.hintline{font-size:13px;color:var(--ink3);margin-top:8px;text-align:center}

.person{display:flex;gap:14px;align-items:center}
.person .av{width:62px;height:62px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(150deg,#f7a24c,#e5761c);box-shadow:0 8px 16px -8px rgba(201,106,20,.7)}
.person b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.person span{font-size:13.5px;color:var(--ink2)}

/* ---------- обратная связь ---------- */
.fb{margin-top:14px;border-radius:18px;padding:14px 15px;animation:rise .3s both;scroll-margin-bottom:96px}
.fb.ok{background:var(--ok-l);border:1.5px solid #bcd49d}
.fb.no{background:var(--red-l);border:1.5px solid #e6b2a8}
.fb h4{margin:0 0 4px;font-size:17px;font-weight:900}
.fb.ok h4{color:var(--ok-d)} .fb.no h4{color:var(--red-d)}
.fb p{font-size:15px;line-height:1.42;color:var(--ink);font-weight:600}
.fb .src{margin-top:7px;font-size:12.5px;color:var(--ink2);font-weight:700;opacity:.85}
.fb .btn{margin-top:12px}

/* ---------- результаты ---------- */
.result{text-align:center}
.result .cat{width:150px;margin:2px auto 4px;display:block}
.result h2{font-size:27px;font-weight:900;line-height:1.1;margin:4px 0 6px}
.result p.sub{color:var(--ink2);font-size:15.5px;margin:0 auto 14px;max-width:360px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:17px;padding:12px 6px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--ink2);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.stat .hearts{justify-content:center}
.stat .heart{width:20px;height:20px}
.rankbox{position:relative;margin:6px 0 14px;padding:18px 14px;border-radius:24px;background:linear-gradient(170deg,#fff3dc,#ffe2b9);border:1.5px solid var(--line2);box-shadow:var(--shadow);overflow:hidden}
.rankbox small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.rankbox b{display:block;font-size:30px;line-height:1.05;font-weight:900;margin:5px 0 6px}
.stars{display:flex;gap:5px;justify-content:center}
.stars svg{width:26px;height:26px}
.stars .off path{fill:#ecd8bb}
.ladder{display:flex;flex-direction:column;gap:6px;text-align:left;margin:12px 0 4px}
.ladder .lr{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 10px;border-radius:12px;color:var(--ink3)}
.ladder .lr i{width:10px;height:10px;border-radius:99px;background:#e8d3b5;flex:none}
.ladder .lr.on{background:rgba(255,255,255,.7);color:var(--ink);font-weight:800}
.ladder .lr.on i{background:var(--or)}
.ladder .lr.done{color:var(--ink2)}
.ladder .lr.done i{background:#e1a566}
.review{text-align:left;margin-top:12px}
.review h3{font-size:16px;font-weight:900;margin-bottom:8px}
.review .it{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:11px 13px;margin-bottom:8px;font-size:14.5px}
.review .it .s{display:block;font-size:12px;color:var(--ink3);margin-top:4px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}

/* ---------- таймлайн ---------- */
.tl{position:relative;margin:14px 0 4px;padding-left:2px}
.tl::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,#f2c691,#e8a561)}
.tlend{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 4px 2px}
.slot{display:flex;align-items:center;gap:10px;margin:0 0 7px;position:relative}
.slot .dot{width:40px;flex:none;display:grid;place-items:center;position:relative;z-index:1}
.slot .dot b{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:13.5px;font-weight:900;background:var(--card);border:2px solid #e8b878;color:var(--or-d);transition:.3s}
.slot .box{flex:1;min-width:0;min-height:38px;border-radius:13px;border:1.8px dashed #dfc196;background:rgba(255,250,241,.6);display:flex;align-items:center;padding:6px 11px;color:var(--ink3);font-size:14px;font-weight:700;transition:.25s}
.slot.sel .box{border-color:var(--or);background:var(--or-ll);box-shadow:0 0 0 4px rgba(239,138,45,.14)}
.slot.fill .box{min-height:48px;border-style:solid;border-color:var(--line2);background:#fffdf8;color:var(--ink);font-size:14.8px;line-height:1.3;cursor:pointer;border-bottom:3.5px solid var(--line2)}
.slot.lock .box{background:var(--ok-l);border-color:var(--ok);border-bottom-color:var(--ok-d);cursor:default}
.slot.lock .dot b{background:var(--ok);border-color:var(--ok);color:#fff}
.slot.bad .box{background:var(--red-l);border-color:#d68a7f;border-bottom-color:var(--red);animation:shake .5s}
.slot .yr{flex:none;margin-left:10px;font-weight:900;font-size:15px;color:var(--ok-d);background:#fff;border:1.5px solid #bcd49d;border-radius:99px;padding:1px 9px;animation:pop .45s}
.pool{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.pool .lbl{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:8px 2px 0}
.ev{padding:10px 13px;border-radius:14px;background:#fffdf8;border:1.5px solid var(--line);border-bottom:3.5px solid var(--line2);font-size:14.8px;font-weight:700;line-height:1.3;text-align:left;width:100%;transition:transform .12s}
.ev:active{transform:translateY(1px)}
.ev.pop{animation:pop .3s}
.tlbar{position:sticky;bottom:var(--foot);margin:10px -18px -16px;padding:18px 18px 12px;z-index:5;background:linear-gradient(180deg,rgba(255,250,241,0),var(--card) 38%);border-radius:0 0 var(--r) var(--r)}

/* ---------- теория ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(74,47,34,.38);animation:fade .25s both}
#sheet .pane{
  position:absolute;left:50%;transform:translateX(-50%);bottom:0;top:28px;width:min(640px,100%);
  background:var(--bg);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;animation:sheetin .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -20px 50px -20px rgba(74,47,34,.5)
}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.pane .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.pane .ph h3{flex:1;font-size:20px;font-weight:900}
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14.5px;color:var(--ink2);transition:.2s}
.tab.on{background:var(--or);color:#fff;border-color:var(--or)}
.pane .pb{flex:1;overflow-y:auto;padding:4px 16px calc(var(--foot) + 28px);-webkit-overflow-scrolling:touch}
.tc{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
.tc h4{margin:0 0 8px;font-size:17px;font-weight:900}
.tc .chips{justify-content:flex-start;margin-bottom:8px}
.tc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.tc li{position:relative;padding-left:16px;font-size:14.8px;line-height:1.42;font-weight:600}
.tc li::before{content:"";position:absolute;left:1px;top:.6em;width:7px;height:7px;border-radius:99px;background:var(--or)}

/* ---------- модалка ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .back{position:absolute;inset:0;background:rgba(74,47,34,.4);animation:fade .2s both}
#modal .box{position:relative;width:min(380px,100%);background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:22px 20px 18px;text-align:center;animation:pop .3s both;box-shadow:0 30px 60px -24px rgba(74,47,34,.6)}
#modal h3{font-size:21px;font-weight:900;margin-bottom:6px}
#modal p{color:var(--ink2);font-size:15.5px;margin-bottom:16px}

/* ---------- подвал ---------- */
#foot{
  position:fixed;left:0;right:0;bottom:0;height:var(--foot);z-index:50;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:rgba(255,248,236,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1.5px solid var(--line);padding:0 12px;
}
#foot img{height:34px;width:auto;display:block}
#foot .nm{font-weight:900;font-size:15px;line-height:1;letter-spacing:.01em;color:var(--ink)}
#foot .nm small{display:block;font-size:11px;color:var(--ink3);font-weight:700;margin-top:2px;white-space:nowrap}
#foot a.sub{
  margin-left:4px;padding:7px 14px;border-radius:99px;background:var(--or);color:#fff;text-decoration:none;
  font-weight:800;font-size:13.5px;border-bottom:3px solid var(--or-d);white-space:nowrap
}
#foot a.sub:active{transform:translateY(1px)}

/* ---------- адаптив ---------- */
@media (max-width:380px){
  .title{font-size:29px}
  .q{font-size:18.5px}
  .opt{font-size:15.5px;padding:12px}
  .opt.year{font-size:21px}
  #foot .nm small{display:none}
  #foot .nm{font-size:13.5px;white-space:nowrap}
  #foot img{height:30px}
  #foot a.sub{padding:7px 11px;font-size:13px}
  .mode .ic{width:50px;height:50px;font-size:26px}
  .stats{gap:7px}
  .stat b{font-size:21px}
}
@media (max-height:640px){
  .home .logo{width:84px}
  .result .cat{width:110px}
}
@media (min-width:700px){
  #app{padding-top:26px}
  .title{font-size:40px}
  .qcard{padding:22px}
  .q{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Теория"></div>

 {h:'Битва на Калке', d:['1223'], p:[
   'Джебе и Субедей (40 тыс.) дошли до Кавказа и степей; половецкий хан Котян попросил помощи у Мстислава Удалого. Собрались Мстислав Удалой, Мстислав Киевский, Мстислав Черниговский, Даниил Волынский.',
   'Конец мая 1223 г. — главные силы монголов разбили русско-половецкий отряд; убито 12 русских князей, жив остался каждый 10-й воин.',
   'Причины поражения: разрозненные действия князей; Мстислав Киевский не участвовал в бою; половцы дрогнули; превосходство монголов в тактике и технике; отказ сильного суздальского войска участвовать в походе.']},
 {h:'Подготовка к походу Батыя', d:['1227','1235'], p:[
   '1227 г. — смерть Чингисхана и Джучи; Чингисиды правили улусами (улус Джучи).',
   '1235 г. — курултай решил продолжить завоевания; Батый (внук Чингисхана) отправился в Европу, разгромил Волжскую Булгарию.',
   'Решили идти зимой — по замёрзшим рекам; князья не ждали зимней войны и рассчитывали на крепости.']},
 {h:'Поход на Северо-Восточную Русь', d:['декабрь 1237','январь 1238','4 марта 1238'], p:[
   'Декабрь 1237 г. — разгром Рязани после шестидневной осады (Евпатий Коловрат); Роман Рязанский и Всеволод Юрьевич проиграли под Коломной.',
   'Январь 1238 г. — сожжена Москва; февраль — осада Владимира (катапульты); за февраль взято 14 городов (Ростов, Тверь).',
   '4 марта 1238 г. — битва на Сити: темник Бурундай; Юрий Всеволодович обезглавлен, пали почти все воины.',
   'Торжок держался почти 2 недели; Козельск — 7 недель («злой город»). Батый не дошёл 100 км до Новгорода: распутица, усталость войска, нехватка провианта, мужество защитников Торжка.']},
 {h:'Поход на Юго-Западную Русь и Европу', d:['1239','1240','6 декабря 1240','1241','1242'], p:[
   '1239 г. — пали Переяславль и Чернигов. Сентябрь 1240 г. — Батый подошёл к Киеву; 6 декабря 1240 г. — падение Киева, разрушена Десятинная церковь.',
   '1241 г. — пали Владимир-Волынский и Галич; разгром польско-немецкой армии у Легницы.',
   '1242 г. — Батый у Адриатического моря; после смерти императора Угедея ушёл на курултай. В 1240-х гг. создана Золотая Орда.',
   'При хане Узбеке (1313–1341) официальной религией стал ислам.']},
 {h:'Последствия нашествия', p:[
   'Плюсы: укрепление позиций церкви, сплочение русского народа, перепись населения и почта, возвышение новых центров (Москва).',
   'Минусы: из 74 городов Батый разорил 49, 14 стёрты с лица земли; упадок хозяйства и ремёсел, потеря населения, консервация раздробленности, культурный упадок.',
   'Зависимость от Орды: ярлык, ордынский выход (примерно 1/10 дохода), баскак. Выход не касался духовенства.',
   'Причины проигрыша Руси: раздробленность, жёсткая дисциплина монгол, китайская военная техника, представления о Судном дне, зимнее наступление.']},
 {h:'Натиск с Запада', d:['1200','1202','1215','1237'], p:[
   '1200 г. — Альберт основал Ригу; 1202 г. — орден меченосцев; 1215 г. — меченосцы захватили Юрьев; 1223 г. — Вячко отвоевал Юрьев, 1224 г. — потеря Юрьева.',
   '1237 г. — образован Ливонский орден (независимое отделение Тевтонского ордена), призван папой Григорием IX на крестовый поход.',
   'Причины экспансии: желание обратить русских в католичество, захват земель для рыцарей, расчёт на лёгкую победу после монголов, новгородские торговые пути.']},
 {h:'Невская битва', d:['15 июля 1240'], p:[
   'Новгород против Швеции за Ладогу и Онегу: Александр Ярославич против Биргера. Ижорский староста Пелгусий сообщил о шведах.',
   '15 июля 1240 г. — внезапная атака; Гаврила Олексич, Сбыслав Якунович, Миша, дружинник Савва.',
   'Итог: защита от шведской экспансии; Александр получил прозвище Невский.']},
 {h:'Ледовое побоище', d:['1240','зима 1242','5 апреля 1242','1268'], p:[
   '1240 г. — посадник Пскова Твердила Иванович пустил в город крестоносцев. Александр взял Копорье, затем Псков.',
   'Русское войско построено «клещами» (или «орлом»), орден — «свиньёй» («кабаньей головой»).',
   '5 апреля 1242 г. — Ледовое побоище на Чудском озере. Орден прислал послов: отступление из Новгородской земли, освобождение пленных.',
   'Итог: рост авторитета Александра, прекращение экспансии крестоносцев на восток, сохранение православия. 1268 г. — битва у Раковора.']},
 {h:'Русские князья и Орда', d:['1243','1246','1252','1257','1262','14 ноября 1263'], p:[
   '1243 г. — Ярослав Всеволодович первым получил ярлык на всю Русь; 1246 г. — умер в Каракоруме после пира.',
   'Михаил Черниговский отказался пройти через священный огонь — казнён. Даниил Галицкий просил Папу о крестовом походе и получил корону, но католики не откликнулись.',
   '1252 г. — восстание Андрея Ярославича, Неврюева рать (отправил хан Сартак); Андрей бежал. Александр Невский получил ярлык на Великое княжение.',
   '1257 г. — перепись; 1257, 1259 гг. — восстания в Новгороде, Александр их подавил. 1262 г. — восстания против бесермен.',
   '14 ноября 1263 г. — Александр Невский умер в Городце. Причины компромисса с Ордой: союзник в борьбе с князьями, безопасность, ярлык, торговля.']},
 {h:'Великое княжество Литовское', d:['1263','1362','1385','1387','1399','1404','1410'], p:[
   'Литва не была завоёвана монголами и сохраняла независимость; Киев оказался под её властью; федеративное устройство; союз с Польшей.',
   '1263 г. — смерть Миндовга. Гедимин (1316–1341) присоединил Полоцк, Брянск, Витебск, Минск, Туров, Новогрудок. Ольгерд (1345–1377): 1362 г. — разгром ордынских ханов у Синих Вод.',
   'Ягайло: 1385 г. — Кревская уния (Польша и Литва — разные государства с общим монархом); 1387 г. — крещение Литвы по католическому образцу.',
   'Витовт (1392–1430): 1399 г. — поражение на Ворскле; 1404 г. — присоединил Смоленск; 15 июля 1410 г. — Грюнвальдская битва, разгром крестоносцев.']}
]},

{id:'msk', title:'Московские князья', sub:'скрипт 5', cards:[
 {h:'Почему Москва', p:[
   'К концу XIII в. на Руси около 250 уделов. Возвысились Тверское, Московское, Суздальско-Нижегородское, Ярославское княжества.',
   'Москва: не старшая ветвь рода (использовала любые способы), почти нет междоусобиц, компромисс с Ордой, поддержка церкви, выгодное положение (леса, торговые пути, миграция с юга).',
   'Тверь стояла прямо на Волге и находилась дальше от Орды, чем Москва; тверские князья имели приоритетное право на ярлык из-за старшинства рода и раньше начали открытую антиордынскую политику. Противостояние Москвы и Твери — жестокие междоусобицы (19 в 1310–1390 гг.).']},
 {h:'Даниил Александрович (1263–1303)', d:['1263','1300','1303'], p:[
   '1263 г. — Москва стала уделом Даниила, младшего сына Александра Невского. 1300 г. — отвоевал у Рязани Коломну.',
   'Унаследовал Переяславское княжество — территория Москвы удвоилась. Так и не стал великим князем.']},
 {h:'Юрий Данилович (1303–1325)', d:['1303','1317','1318','1322','1325','1326'], p:[
   '1303 г. — присоединил Можайск. Женат на Кончаке, сестре хана Узбека. Получил ярлык, хотя по старшинству он принадлежал Михаилу Тверскому.',
   '1317 г. — Бортенево, поражение. 1318 г. — Михаил убит в Орде; 1322 г. — ярлык у Дмитрия Грозные Очи; 1325 г. — Дмитрий в Орде зарубил Юрия; 1326 г. — Дмитрий казнён.']},
 {h:'Иван Калита (1325–1340)', d:['1326','1327','1328','1339'], p:[
   'Калита («денежный мешок»): раздавал вотчины боярам, привлекал мурз, ездил в Сарай с дарами и утаивал часть дани.',
   '1326 г. — с митрополитом Петром заложил первый каменный Успенский собор. 1328 г. — Феогност перенёс резиденцию в Москву.',
   '1327 г. — антиордынское восстание в Твери (Чолхан), подавлено Калитой с ордынскими ратями; упадок Твери. 1328 г. — ярлык на великое Владимирское княжение. 1339 г. — Александр Тверской казнён в Орде.']},
 {h:'«Великая тишина»', d:['1328–1367','1340–1353','1353–1359','1353','1359–1380'], p:[
   '«Великая тишина» — 1328–1367 гг.: сотрудничество с Ордой, нет разорительных набегов. Построен дубовый Кремль, присоединены Углич, Галич, Белоозеро.',
   'Симеон Гордый (1340–1353), Иван II Красный (1353–1359). 1353 г. — чума: умер Симеон, потом Иван II. Чума ослабила Орду: «Великая замятня» (1359–1380).']},
 {h:'Дмитрий Донской (1359–1389)', d:['1362','1367','1375','1377','1378'], p:[
   'Получил власть в 9 лет; опекун — митрополит Алексий. 1362 г. — ярлык от хана Мурата. 1367 г. — белокаменный Кремль.',
   '1367–1375 гг. — борьба за ярлык (Дмитрий Суздальско-Нижегородский, Михаил Тверской; «литовщины» Ольгерда). 1375 г. — поход на Тверь.',
   '1377 г. — битва на Пьяне (Арапша). 11 августа 1378 г. — битва на Воже: победа над Бегичем — первая крупная победа над монголами со времён Батыя.']},
 {h:'Куликовская битва', d:['8 сентября 1380'], p:[
   'Причина: Мамай хотел наказать за Вожу. Сбор в Коломне; Сергий Радонежский благословил и послал Пересвета и Ослябю.',
   'Олег Рязанский не явился, Ягайло не дошёл; Андрей Полоцкий и Дмитрий Брянский — с Дмитрием. Мосты сожжены, Засадный полк — Владимир Серпуховской и Боброк-Волынский.',
   'Победа: общерусское войско, благословение Сергия, талант Дмитрия, «Великая замятня». Дмитрий — «Донской», Владимир — «Храбрый». Зависимость не исчезла.']},
 {h:'Тохтамыш и Василий I (1389–1425)', d:['1382','1395','1399','1408','1419'], p:[
   '1382 г. — Тохтамыш: оборона Москвы под началом Остея длилась 3 дня; хан вошёл обманом; дань возобновлена; заложник — Василий.',
   'Василий I: по завещанию отца, обойдя лествичный порядок; жена — Софья Витовтовна; присоединил Муром, Тарусу, Городец.',
   '1395 г. — Тамерлан разгромил Орду и сжёг Елец; в Москву доставили Владимирскую икону, Тамерлан вернулся в степи. 1399 г. — Ворскла; 1408 г. — Едигеева рать; 1419 г. — смерть Едигея.']},
 {h:'Василий II Тёмный (1425–1462)', d:['1430','1434','1438','1439','1445','1446','1447','1448','1452','1453','1456'], p:[
   'Феодальная война 1425–1453 гг.: Юрий Звенигородский ссылался на духовную грамоту Дмитрия Донского — кризис лествичной системы. Повод — золотой пояс на свадьбе.',
   '1434 г. — смерть Юрия; 1438 г. — Казань; 1439 г. — Флорентийская уния; 1445 г. — плен у Улу-Мухаммеда; 1446 г. — Шемяка ослепил Василия; 1447 г. — возвращение престола; 1448 г. — автокефалия; 1452 г. — Касимовское ханство; 1453 г. — смерть Шемяки.',
   'Итоги: отказ от лествичной системы, укрепление власти князя. 1456 г. — Яжелбицкий мир с Новгородом.']},
 {h:'Иван III (1462–1505)', d:['1471','1472','1477','1478','1480','1485','1497'], p:[
   'Присоединение Новгорода: 1471 — Шелонь; 1477 — поход; 1478 — вече принимает условия, колокол увезён, Марфа Борецкая сослана.',
   '1472 г. — перестал платить дань, женился на Софье Палеолог, присоединил Пермь; 1480 г. — стояние на Угре (Ахмат).',
   '1485 г. — Тверь; 1489 г. — Вятка; 1501–1503 гг. — война с Литвой. 1497 г. — Судебник; Казна и Дворец, Боярская дума; поместья — земля за службу.',
   'Итог: создано ядро единого Русского государства.']},
 {h:'Василий III (1505–1533)', d:['1510','1512','1514','1521','1522','1525'], p:[
   '1510 г. — Псков; 1512 г. — война с Литвой; 1514 г. — Михаил Глинский взял Смоленск; 1521 г. — Рязань; 1522 г. — перемирие с Литвой.',
   'Нестяжатели (Нил Сорский) и иосифляне (Иосиф Волоцкий); Филофей — «Москва — Третий Рим». 1525 г. — Максим Грек ложно обвинён в ереси.',
   'Значение: завершение раздробленности, свержение Орды, отпор Литве, рост международного авторитета.']}
]}
];

/* ---------- построение вопросов ---------- */
function balancedSlots(n, k){
  var res = [];
  while (res.length < n) res = res.concat(shuffle(range(k)));
  return res.slice(0, n);
}
function placeAt(correct, others, slot){            // вернуть {opts, ci}
  var o = shuffle(others), out = [];
  for (var i = 0, j = 0; i < o.length + 1; i++) out.push(i === slot ? correct : o[j++]);
  return {opts: out, ci: slot};
}

function buildDates(){
  var slots = balancedSlots(DATES.filter(function(d){ return d.t === 'mc'; }).length, 4), si = 0, rounds = [];
  for (var r = 0; r < 5; r++){
    var qs = shuffle(DATES.filter(function(d){ return d.r === r; })).map(function(d){
      var q = {kind:d.t, text:d.q, y:d.y, n:d.n, s:d.s, rev:{t:d.q, n:d.n, s:d.s}};
      if (d.t === 'mc'){
        var pool = shuffle(d.d.filter(function(y){ return y !== d.y; })).slice(0, 3);
        var pl = placeAt(d.y, pool, slots[si++]);
        q.opts = pl.opts; q.ci = pl.ci;
      }
      return q;
    });
    rounds.push(qs);
  }
  return rounds;
}

function runOK(seq){ for (var i = 2; i < seq.length; i++) if (seq[i] === seq[i-1] && seq[i] === seq[i-2]) return false; return true; }
function buildTruth(){
  var pat = Math.random() < .5 ? [3,2,3,2,3] : [2,3,2,3,2], rounds = [], tail = [];
  for (var r = 0; r < 5; r++){
    var pool = TRUTH.filter(function(t){ return t.r === r; });
    var T = shuffle(pool.filter(function(t){ return t.v; })).slice(0, pat[r]);
    var F = shuffle(pool.filter(function(t){ return !t.v; })).slice(0, 5 - pat[r]);
    var items = T.concat(F), arr = items;
    for (var k = 0; k < 300; k++){
      arr = shuffle(items);
      if (runOK(tail.concat(arr.map(function(t){ return t.v; })))) break;
    }
    tail = arr.slice(-2).map(function(t){ return t.v; });
    rounds.push(arr.map(function(t){ return {kind:'tf', text:t.q, v:t.v, n:t.n, s:t.s, rev:{t:t.q, n:t.n, s:t.s}}; }));
  }
  return rounds;
}

function stemHit(p, text){ return p.stems.some(function(s){ return text.indexOf(s) >= 0; }); }
function ownersOf(e){ return e.w.slice(0, 3).join(' · '); }
function matchDistractors(p, cor){
  var blk = BLOCK_OF[p.tag];
  var pool = EV.filter(function(e){ return e !== cor && e.w.indexOf(p.n) < 0 && !stemHit(p, e.t); });
  var same = shuffle(pool.filter(function(e){ return e.s[0] === blk; })), other = shuffle(pool.filter(function(e){ return e.s[0] !== blk; }));
  var used = {}; used[cor.w[0]] = 1; var res = [];
  function take(list, cnt){
    for (var i = 0; i < list.length && cnt > 0; i++){
      var e = list[i]; if (used[e.w[0]] || res.indexOf(e) >= 0) continue;
      used[e.w[0]] = 1; res.push(e); cnt--;
    }
  }
  take(same, 2); take(other, 1); take(same.concat(other), 3 - res.length);
  return res;
}
function buildMatch(){
  var slots = balancedSlots(25, 4), si = 0, rounds = [[], [], [], [], []];
  PEOPLE.forEach(function(p){
    var own = EV.filter(function(e){ return e.by === p.n; });
    var cor = pick(own), ds = matchDistractors(p, cor);
    var pl = placeAt(cor, ds, slots[si++]);
    rounds[p.r].push({kind:'match', person:p, opts:pl.opts, ci:pl.ci, s:cor.s,
      n:'«' + cor.t + '»', rev:{t:p.n + ': ' + cor.t, n:'', s:cor.s}});
  });
  return rounds.map(shuffle);
}

function buildTime(){
  return TIMELINES.map(function(tl){
    var order = range(tl.items.length), sorted = true;
    for (var k = 0; k < 100; k++){
      order = shuffle(range(tl.items.length));
      var ident = order.every(function(v, i){ return v === i; });
      var adj = 0; order.forEach(function(v, i){ if (i && Math.abs(v - order[i-1]) === 1) adj++; });
      if (!ident && adj < 3) break;
    }
    return {kind:'time', tl:tl, order:order};
  });
}
function buildRounds(mode){
  if (mode === 'dates') return buildDates();
  if (mode === 'truth') return buildTruth();
  if (mode === 'match') return buildMatch();
  return buildTime().map(function(x){ return [x]; });
}

  G.locked = true; inp.disabled = true; $('#ok').disabled = true;
  var ok = +v === G.cur.y; inp.classList.add(ok ? 'correct' : 'wrong');
  conclude(ok, G.cur, v);
}

function nextLabel(){
  if (G.lives <= 0) return 'Дальше';
  var lastQ = G.mode === 'time' || G.qi === 4;
  if (!lastQ) return 'Дальше';
  return G.r === G.rounds.length - 1 ? 'Итоги раунда' : 'Итоги раунда';
}
function conclude(ok, q, typed){
  G.answered++;
  var broke = -1;
  if (ok){ G.correct++; G.rc++; G.streak++; if (G.streak > G.rbest) G.rbest = G.streak; if (G.streak > G.bestStreak) G.bestStreak = G.streak; }
  else { G.lives--; G.mist++; G.rmiss++; G.streak = 0; G.missed.push(q.rev); broke = G.lives; }
  G.dots.push(ok ? 'ok' : 'bad');
  var hs = $('.hearts'); if (hs) hs.innerHTML = heartsHTML(G.lives, broke);
  var bar = $('.bar i'); if (bar) bar.style.width = Math.round((doneBefore() + 1) / G.total * 100) + '%';
  var dots = $$('.dots i'); dots.forEach(function(d, i){ d.className = i < G.dots.length ? G.dots[i] : ''; });

  var head = ok ? pick(PRAISE) : pick(OOPS), msg = '';
  if (q.kind === 'mc' || q.kind === 'type') msg = (ok ? '' : 'Правильный ответ: <b>' + q.y + '</b>. ') + esc(q.n);
  else if (q.kind === 'tf') msg = esc(q.n);
  else msg = (ok ? 'Верно: ' : 'Правильный ответ: ') + esc(q.n);
  var fb = $('#fb');
  fb.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><h4>' + head + '</h4><p>' + msg + '</p><div class="src">' + srcText(q.s) + '</div>' +
    '<button class="btn' + (ok ? '' : ' red') + '" id="nx">' + nextLabel() + '</button></div>';
  $('#nx').onclick = nextQ;
  setTimeout(function(){ var el = $('.fb'); if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'}); }, 80);
}
function nextQ(){
  if (G.lives <= 0) return gameOver();
  if (G.mode !== 'time' && G.qi < 4){ G.qi++; ask(); } else roundResult();
}

/* ---------- таймлайн ---------- */
function askTime(q){
  var n = q.tl.items.length;
  TL = {q:q, slots:range(n).map(function(){ return null; }), lock:range(n).map(function(){ return false; }), sel:null, checks:0, busy:false, done:false, over:false, first:null};
  view(hudHTML() + '<div class="card qcard"><div class="qtag"><span class="chip n">⏳ Таймлайн</span><span class="chip">' + esc(q.tl.sub) + '</span></div>' +
    '<div class="q s">Расставь события по порядку — от раннего к позднему.<small>Нажми на событие — оно займёт первое свободное место. Или сначала выбери место на ленте.</small></div>' +
    '<div class="tlend"><span>раньше</span><span>позже</span></div><div class="tl" id="tl"></div><div class="pool" id="pool"></div><div id="fb"></div>' +
    '<div class="tlbar"><button class="btn" id="chk" disabled>Проверить порядок</button></div></div>');
  bindExit(); drawTime();
}
function drawTime(){
  var items = TL.q.tl.items, n = items.length;
  var tlh = '';
  for (var i = 0; i < n; i++){
    var v = TL.slots[i], cls = 'slot' + (v !== null ? ' fill' : '') + (TL.lock[i] ? ' lock' : '') + (TL.sel === i && v === null ? ' sel' : '');
    tlh += '<div class="slot' + cls.substr(4) + '" data-s="' + i + '"><div class="dot"><b>' + (i + 1) + '</b></div><div class="box">' +
      (v !== null ? '<span style="flex:1">' + esc(items[v].t) + '</span>' + (TL.lock[i] ? '<span class="yr">' + items[v].y + '</span>' : '') : (i === 0 ? 'самое раннее' : (i === n - 1 ? 'самое позднее' : 'место ' + (i + 1)))) + '</div></div>';
  }
  $('#tl').innerHTML = tlh;
  var placed = {}; TL.slots.forEach(function(v){ if (v !== null) placed[v] = 1; });
  var ph = '';
  TL.q.order.forEach(function(idx){ if (!placed[idx]) ph += '<button class="ev" data-i="' + idx + '">' + esc(items[idx].t) + '</button>'; });
  $('#pool').innerHTML = ph ? '<div class="lbl">События без дат</div>' + ph : '';
  var full = TL.slots.every(function(v){ return v !== null; });
  var chk = $('#chk'); if (chk){ chk.disabled = !full || TL.busy || TL.done || TL.over; chk.onclick = checkTime; }
  $$('.ev').forEach(function(b){ b.onclick = function(){ placeEv(+b.getAttribute('data-i')); }; });
  $$('.slot').forEach(function(s){ s.onclick = function(){ slotTap(+s.getAttribute('data-s')); }; });
}
function placeEv(idx){
  if (TL.busy || TL.done || TL.over) return;
  var t = -1;
  if (TL.sel !== null && TL.slots[TL.sel] === null && !TL.lock[TL.sel]) t = TL.sel;
  else for (var i = 0; i < TL.slots.length; i++) if (TL.slots[i] === null && !TL.lock[i]){ t = i; break; }
  if (t < 0) return;
  TL.slots[t] = idx; TL.sel = null; drawTime();
}
function slotTap(i){
  if (TL.busy || TL.done || TL.over || TL.lock[i]) return;
  if (TL.slots[i] !== null){ TL.slots[i] = null; TL.sel = i; }
  else TL.sel = TL.sel === i ? null : i;
  drawTime();
}
function checkTime(){
  if (TL.busy || TL.done || TL.over) return;
  var wrong = [];
  TL.slots.forEach(function(v, i){ if (!TL.lock[i]){ if (v === i) TL.lock[i] = true; else wrong.push(i); } });
  TL.checks++; G.checks++;
  if (TL.checks === 1) G.firstTry = TL.lock.filter(Boolean).length;
  if (!wrong.length){
    TL.done = true; G.correct += 1; G.rc = 1; G.dots.push('ok');
    drawTime(); $('#chk').hidden = true;
    $('.bar i').style.width = Math.round((G.r + 1) / G.total * 100) + '%';
    $('#fb').innerHTML = '<div class="fb ok"><h4>' + pick(PRAISE) + ' Лента собрана!</h4><p>Годы открыты. Теперь посмотри на ленту целиком и запомни последовательность.</p><div class="src">' +
      TL.q.tl.items.map(function(it){ return it.y; }).join(' → ') + '</div><button class="btn" id="nx">' + nextLabel() + '</button></div>';
    $('#nx').onclick = nextQ;
    setTimeout(function(){ var el = $('.fb'); if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'}); }, 80);
    return;
  }
  TL.busy = true; G.lives--; G.mist++; G.missed.push({t:'Таймлайн «' + TL.q.tl.title + '»: порядок событий', n:'', s:TL.q.tl.items[0].s});
  var broke = G.lives; $('.hearts').innerHTML = heartsHTML(G.lives, broke);
  drawTime(); $$('.slot').forEach(function(s){ var i = +s.getAttribute('data-s'); if (wrong.indexOf(i) >= 0) s.classList.add('bad'); });
  $('#chk').disabled = true;
  if (G.lives <= 0){
    TL.over = true;
    $('#fb').innerHTML = '<div class="fb no"><h4>Жизни закончились</h4><p>Порядок был неверным. Повтори теорию и попробуй снова.</p><button class="btn red" id="nx">Дальше</button></div>';
    $('#nx').onclick = gameOver; TL.busy = false;
    return;
  }
  setTimeout(function(){
    wrong.forEach(function(i){ TL.slots[i] = null; }); TL.busy = false; TL.sel = null; drawTime();
    var f = $('#fb'); if (f) f.innerHTML = '<div class="fb no"><h4>' + pick(OOPS) + '</h4><p>Верные события остались на своих местах. Расставь остальные заново.</p></div>';
  }, 950);
}

/* ---------- итоги раунда ---------- */
function roundResult(){
  var isT = G.mode === 'time', rc = G.rc, perfect = isT ? G.checks === 1 : rc === 5;
  var title, sub;
  if (isT){
    title = G.checks === 1 ? 'Идеальная лента!' : 'Лента собрана!';
    sub = G.checks === 1 ? 'Все события встали верно с первой проверки.' : 'Ты справился с «' + roundTitle() + '». Ещё один шаг к званию.';
  } else if (rc === 5){ title = 'Идеальный раунд!'; sub = 'Все пять — без единой ошибки.'; }
  else if (rc === 4){ title = 'Почти идеально!'; sub = 'Только один промах — отличный результат.'; }
  else if (rc === 3){ title = 'Хороший раунд!'; sub = 'Три из пяти — двигаемся дальше.'; }
  else { title = 'Раунд пройден!'; sub = 'Бывает — зато теперь эти факты точно запомнятся.'; }
  G.rstat.push({rc:rc, miss:G.rmiss});
  var last = G.r === G.rounds.length - 1;
  var tiles = isT
    ? '<div class="stat"><b>' + G.firstTry + '/8</b><span>с 1-го раза</span></div><div class="stat"><b>' + G.checks + '</b><span>проверок</span></div>'
    : '<div class="stat"><b>' + rc + '/5</b><span>верно</span></div><div class="stat"><b>' + G.rbest + '</b><span>серия</span></div>';
  var nextTitle = last ? '' : (isT ? TIMELINES[G.r + 1].title : ROUND_TITLES[G.r + 1]);
  view('<div class="result">' + cat(perfect ? 'wow' : 'happy') +
    '<div class="eyebrow">' + (isT ? 'Таймлайн ' : 'Раунд ') + (G.r + 1) + ' из ' + G.rounds.length + ' · ' + esc(roundTitle()) + '</div><h2>' + title + '</h2><p class="sub">' + sub + '</p>' +
    '<div class="stats">' + tiles + '<div class="stat"><div class="hearts">' + heartsHTML(G.lives, -1) + '</div><span>жизни</span></div></div>' +
    (isT ? '' : '<p class="hintline">Всего верно: <b>' + G.correct + '</b> из ' + (G.r + 1) * 5 + '</p>') +
    '<div class="sp"></div><button class="btn" id="nr">' + (last ? 'Узнать звание' : 'Дальше: ' + esc(nextTitle)) + '</button></div>');
  if (perfect) confetti(40); else if (rc >= 3) confetti(18);
  $('#nr').onclick = function(){ if (last) finalScreen(); else { G.r++; newRound(); } };
}

function ladderHTML(info){
  return '<div class="ladder">' + info.names.map(function(nm, i){
    return '<div class="lr' + (i === info.idx ? ' on' : (i < info.idx ? ' done' : '')) + '"><i></i>' + esc(nm) + '</div>';
  }).join('') + '</div>';
}
function finalScreen(){
  var info = rankInfo(G.mode, G.correct, G.lives, true), isT = G.mode === 'time';
  var stars = isT ? Math.max(3, G.lives + 2) : 5 - G.mist;
  saveBest(G.mode, {score:100 + (isT ? G.lives : G.correct), c:G.correct, name:info.name, done:true});
  var mk = MODES[G.mode];
  var stats = isT
    ? '<div class="stat"><b>' + G.checks + '</b><span>проверок</span></div><div class="stat"><b>' + G.mist + '</b><span>ошибок</span></div><div class="stat"><div class="hearts">' + heartsHTML(G.lives, -1) + '</div><span>жизни</span></div>'
    : '<div class="stat"><b>' + G.correct + '/25</b><span>верно</span></div><div class="stat"><b>' + G.mist + '</b><span>ошибок</span></div><div class="stat"><b>' + G.bestStreak + '</b><span>лучшая серия</span></div>';
  view('<div class="result">' + cat('wow') + '<div class="eyebrow">' + mk.icon + ' ' + mk.name + ' · пройдено</div><h2>Победа!</h2>' +
    '<div class="rankbox"><small>Твоё звание</small><b>' + esc(info.name) + '</b>' + starsHTML(stars, 5) + ladderHTML(info) + '</div>' +
    '<div class="stats">' + stats + '</div>' +
    '<div class="stack"><button class="btn" id="again">Сыграть ещё</button><button class="btn ghost" id="th">' + I.book + ' Повторить теорию</button>' +
    '<a class="btn ghost" href="' + TG + '" target="_blank" rel="noopener">Подписаться на «Историю и котиков»</a></div></div>');
  confetti(70);
  $('#again').onclick = home; $('#th').onclick = function(){ openTheory(0); };
}
function gameOver(){
  var info = rankInfo(G.mode, G.correct, 0, false), mk = MODES[G.mode], isT = G.mode === 'time';
  saveBest(G.mode, {score:isT ? 0 : G.correct, c:G.correct, name:info.name, done:false});
  var rev = G.missed.slice(0, 4).map(function(m){
    return '<div class="it">' + esc(m.t) + (m.n ? '<span class="s">' + esc(m.n) + '</span>' : '') + '<span class="s">' + srcText(m.s) + '</span></div>';
  }).join('');
  var prog = isT ? 'Собрано лент: ' + G.r + ' из 3' : 'Верных ответов: ' + G.correct + ' из ' + G.total;
  view('<div class="result">' + cat('sad') + '<div class="eyebrow">' + mk.icon + ' ' + mk.name + '</div><h2>Жизни закончились</h2>' +
    '<p class="sub">Три ошибки — и дружина пала. Ничего, историки учатся на ошибках! ' + prog + '.</p>' +
    '<div class="rankbox"><small>Звание за эту попытку</small><b>' + esc(info.name) + '</b></div>' +
    '<div class="review"><h3>Стоит повторить</h3>' + rev + '</div><div class="sp"></div>' +
    '<div class="stack"><button class="btn" id="again">Начать заново</button><button class="btn ghost" id="th">' + I.book + ' Повторить теорию</button></div></div>');
  $('#again').onclick = home; $('#th').onclick = function(){ openTheory(0); };
}

/* ---------- запуск ---------- */
window.addEventListener('DOMContentLoaded', home);

</script>
</body>
</html>
